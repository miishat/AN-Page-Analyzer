name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Runs every time you push to the main branch

permissions:
  contents: write  # Allows the action to push to your gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # dist for vite
          branch: gh-pages # The branch the action will push the build to
